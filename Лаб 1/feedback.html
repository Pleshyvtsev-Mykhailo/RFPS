<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АстроІнфо — Зворотній зв'язок</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
 
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/feedback.css">

</head>
<body>

    <header>
        <img src="images/logo.png" alt="Логотип АстроІнфо" width="140" height="80">
        <h1>Енциклопедія "АстроІнфо" — Зворотній зв'язок</h1>
        <nav>
            <ul>
                <li><a href="index.html">Головна</a></li>
                <li><a href="planets.html">Розділ про Планети</a></li>
                <li><a href="telescopes.html">Розділ про Телескопи</a></li>
                <li><a href="feedback.html">Зворотній зв'язок</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Форма зворотнього зв'язку</h2>

        <form action="#" method="post">
            
            <fieldset class="personal">
                <legend>Персональна інформація</legend>
                
                <p>
                    <label for="fullname">1. Прізвище та ім'я:</label><br>
                    <input type="text" id="fullname" name="fullname" placeholder="Іваненко Іван" required>
                </p>

                <p>
                    <label for="email">2. E-mail:</label><br>
                    <input type="email" id="email" name="email" placeholder="user@example.com" required>
                </p>

                <p>
                    <label for="age">3. Вік:</label><br>
                    <input type="number" id="age" name="age" min="10" max="120" placeholder="20" required>
                </p>

                <p>
                    <label for="education">4. Освіта:</label><br>
                    <select id="education" name="education" required>
                        <option value="">-- Оберіть освіту --</option>
                        <option value="full">повна</option>
                        <option value="incomplete">неповна</option>
                        <option value="higher">вища</option>
                        <option value="vocational">професійна</option>
                    </select>
                </p>
            </fieldset>

            <br>

            <p class="purpose">
                <label for="purpose">5. Мета зворотнього зв'язку:</label><br>
                <select id="purpose" name="purpose" required>
                    <option value="cooperation">співпраця</option>
                    <option value="copyright">скарга на порушення права власності</option>
                    <option value="proposal">пропозиція</option>
                    <option value="error">наявність помилки</option>
                </select>
            </p>

            <p class="details">
                <label for="details">6. Детально (макс. 500 символів):</label><br>
                <textarea id="details" name="details" rows="6" cols="50" maxlength="500" placeholder="Введіть ваш текст тут..." required></textarea>
            </p>

            <p class="consent">
                <input type="checkbox" id="consent" name="consent" required>
                <label for="consent">Я надаю згоду на обробку моїх персональних даних</label>
            </p>

            <p class="actions">
                <button type="submit">Надіслати</button>
                <button type="reset">Скинути</button>
            </p>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Енциклопедія "АстроІнфо"</p>
    </footer>

</body>
</html>
